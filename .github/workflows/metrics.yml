name: Generate isometric contribution calendar

on:
  schedule:
    - cron: "23 1 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Manual setup required:
      # Add a repository Actions secret named GH_TOKEN in Settings > Secrets and
      # variables > Actions. Use a classic PAT with `repo` and `user` scopes.
      - name: Render isometric calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GH_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: Muhibmirza
          filename: github-metrics.svg
          template: terminal
          base: ""
          config_timezone: Asia/Karachi
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
