name: Generate isometric contribution calendar

on:
  schedule:
    - cron: "23 1 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # The repository's built-in token is sufficient for this public profile.
      # If private-repository metrics are enabled later, replace this with a
      # manually added GH_TOKEN secret that has the required repository scopes.
      - name: Render isometric calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: Muhibmirza
          filename: github-metrics.svg
          template: terminal
          base: ""
          config_timezone: Asia/Karachi
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
